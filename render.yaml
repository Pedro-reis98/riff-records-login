databases:
  - name: riff-records-db
    plan: free
    databaseName: riffrecords
    user: riffrecords

services:
  - type: web
    name: riff-records-login
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix server ci && npm run build:web
    startCommand: npm --prefix server start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: riff-records-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
